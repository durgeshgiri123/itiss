      { name: '📄 Assignment Wireshark',                     path: 'Security Concepts/Sanjay sir pdf and assignment/Wireshark - LAB (1).pdf', subfolder: 'Sanjay Sir — PDFs & Assignments' },
      
    ]
  }
];

const CAT_BADGE = { infra: 'DevOps', prog: 'Programming', sec: 'Security' };

const sidebar = document.getElementById('sidebar');

CATEGORIES.forEach((cat, ci) => {
  const section = document.createElement('div');
  section.className = 'category';
  section.dataset.catId = cat.id;

  const hdr = document.createElement('div');
  hdr.className = 'cat-header' + (ci === 0 ? ' open' : '');
  hdr.innerHTML = `<span class="dot" style="background:${cat.color}"></span><span>${cat.label}</span><span class="chevron">▶</span>`;

  const fileList = document.createElement('div');
  fileList.className = 'cat-files' + (ci === 0 ? ' open' : '');

  let lastSubfolder = null;
  cat.files.forEach(f => {
    if (f.subfolder && f.subfolder !== lastSubfolder) {
      lastSubfolder = f.subfolder;
      const lbl = document.createElement('div');
      lbl.className = 'subfolder-label';
      lbl.textContent = f.subfolder;
      fileList.appendChild(lbl);
    }
    const item = document.createElement('div');
    item.className = 'file-item';
    item.dataset.path = f.path;
    item.dataset.catId = cat.id;
    item.textContent = f.name;
    item.addEventListener('click', () => loadFile(f.path, f.name, cat));
    fileList.appendChild(item);
  });

  hdr.addEventListener('click', () => {
    const isOpen = hdr.classList.contains('open');
    hdr.classList.toggle('open', !isOpen);
    fileList.classList.toggle('open', !isOpen);
  });

  section.appendChild(hdr);
  section.appendChild(fileList);
  sidebar.appendChild(section);
});

function setActive(path) {
  document.querySelectorAll('.file-item').forEach(el => el.classList.toggle('active', el.dataset.path === path));
}

const content = document.getElementById('content');

async function loadFile(path, name, cat) {
  setActive(path);
  closeSidebarOnMobile();
  content.innerHTML = `<div class="loading"><div class="spinner"></div><span>Loading ${name}…</span></div>`;

  if (path.toLowerCase().endsWith('.pdf')) {
    renderPDF(path, name, cat);
    return;
  }

  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`HTTP ${res.status} — ${res.statusText}`);
    const md = await res.text();
    const html = marked.parse(md);
    content.innerHTML = `
      <div class="article-wrapper">
        <div class="article-meta">
          <span class="badge" style="background:${cat.color}22;color:${cat.color}">${CAT_BADGE[cat.id]}</span>
          <span>${name}</span>
        </div>
        <div class="md-body">${html}</div>
      </div>`;
    content.scrollTop = 0;
  } catch (err) {
    content.innerHTML = `
      <div class="article-wrapper">
        <div class="error-box">⚠ Could not load file<br><br><strong>${path}</strong><br><br>${err.message}<br><br>
          <span style="color:var(--text-dim)">Make sure you opened index.html from a local server (e.g. <code>python -m http.server</code>)</span>
        </div>
      </div>`;
  }
}

function renderPDF(path, name, cat) {
  const encodedPath = path.split('/').map(encodeURIComponent).join('/');
  content.innerHTML = `
    <div class="pdf-wrapper">
      <div class="pdf-toolbar">
        <span class="badge" style="background:${cat.color}22;color:${cat.color}">${CAT_BADGE[cat.id]}</span>
        <span class="pdf-title">📄 ${name}</span>
        <button class="pdf-btn" onclick="window.open('${encodedPath}','_blank')" title="Open in new tab">↗ <span class="btn-label">Open</span></button>
        <a class="pdf-btn primary" href="${encodedPath}" download="${name}" title="Download PDF">↓ <span class="btn-label">Download</span></a>
      </div>
      <div class="pdf-frame-container" id="pdfContainer">
        <iframe id="pdfFrame" src="${encodedPath}" title="${name}" allowfullscreen></iframe>
        <div class="pdf-fallback" id="pdfFallback">
          <div class="pdf-icon">📄</div>
          <p>Your browser blocked the inline PDF viewer.<br>
          Use the buttons above to <strong>open</strong> or <strong>download</strong> the file.</p>
        </div>
      </div>
    </div>`;
  content.scrollTop = 0;

  const iframe = document.getElementById('pdfFrame');
  const fallback = document.getElementById('pdfFallback');
  iframe.addEventListener('error', () => { iframe.style.display = 'none'; fallback.style.display = 'flex'; });
  setTimeout(() => {
    try { if (iframe.contentDocument === null && iframe.src) {} } catch(e) { iframe.style.display = 'none'; fallback.style.display = 'flex'; }
  }, 3000);
}

document.getElementById('search').addEventListener('input', function () {
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll('.file-item').forEach(el => { el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? '' : 'none'; });
  CATEGORIES.forEach(cat => {
    const section = sidebar.querySelector(`[data-cat-id="${cat.id}"]`);
    if (!section) return;
    const visible = [...section.querySelectorAll('.file-item')].some(el => el.style.display !== 'none');
    section.querySelector('.cat-header').classList.toggle('open', visible);
    section.querySelector('.cat-files').classList.toggle('open', visible);
  });
});

const sidebarEl = document.getElementById('sidebar');
document.getElementById('toggleBtn').addEventListener('click', () => sidebarEl.classList.toggle('open'));
function closeSidebarOnMobile() { if (window.innerWidth <= 768) sidebarEl.classList.remove('open'); }
document.getElementById('content').addEventListener('click', closeSidebarOnMobile);
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('search').focus(); } });
</script>
</body>
</html>
